<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabla periódica 3º ESO</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#667;--ac:#4f46e5;--ok:#16a34a;--ko:#dc2626;--bd:#d9dce6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--card:#1d212d;--tx:#eceef5;--mu:#98a0b5;--ac:#818cf8;--ok:#4ade80;--ko:#f87171;--bd:#343a4d}}
*{box-sizing:inherit}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 14px;background:var(--ac);color:#fff;width:100%;margin-top:8px;cursor:pointer}
button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
input{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.big{font-size:56px;font-weight:700;text-align:center;margin:8px 0}.mid{font-size:30px;font-weight:700;text-align:center}
.mu{color:var(--mu);font-size:14px}.ok{color:var(--ok)}.ko{color:var(--ko)}
.bar{height:6px;background:var(--bd);border-radius:3px;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--ac);border-radius:3px}
.grid{display:grid;grid-template-columns:22px repeat(8,1fr);gap:4px;margin-top:10px}
.grid b{font-size:12px;color:var(--mu);text-align:center;align-self:center}
.c{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:0;margin:0;width:auto}
.c.e{border-style:dashed;background:transparent;opacity:.35}
.c.good{background:var(--ok);color:#fff;border-color:var(--ok)}.c.bad{background:var(--ko);color:#fff;border-color:var(--ko)}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}.row:last-child{border:0}
select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin-top:8px}textarea{font:12px/1.3 monospace;width:100%;height:120px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px;word-break:break-all}.tabs{display:flex;gap:6px}.tabs button{margin:0 0 12px}.gr{display:grid;grid-template-columns:16px repeat(18,28px);gap:2px;width:max-content;margin:10px 0 4px}.gr b{font-size:10px;color:var(--mu);text-align:center;align-self:center}.gr .c{font-size:11px;border-radius:5px}.gr .o{font-weight:400;color:var(--mu);background:transparent;font-size:10px}.gr .r{font-size:7px}.gr .t{border:2px solid var(--ac)}</style></head><body><div id="app"></div>
<script>
const E=[[1,'H','Hidrógeno',1,1],[3,'Li','Litio',1,2],[11,'Na','Sodio',1,3],[19,'K','Potasio',1,4],[37,'Rb','Rubidio',1,5],[55,'Cs','Cesio',1,6],[87,'Fr','Francio',1,7],
[4,'Be','Berilio',2,2],[12,'Mg','Magnesio',2,3],[20,'Ca','Calcio',2,4],[38,'Sr','Estroncio',2,5],[56,'Ba','Bario',2,6],[88,'Ra','Radio',2,7],
[5,'B','Boro',13,2],[13,'Al','Aluminio',13,3],[31,'Ga','Galio',13,4],[49,'In','Indio',13,5],[81,'Tl','Talio',13,6],
[6,'C','Carbono',14,2],[14,'Si','Silicio',14,3],[32,'Ge','Germanio',14,4],[50,'Sn','Estaño',14,5],[82,'Pb','Plomo',14,6],
[7,'N','Nitrógeno',15,2],[15,'P','Fósforo',15,3],[33,'As','Arsénico',15,4],[51,'Sb','Antimonio',15,5],[83,'Bi','Bismuto',15,6],
[8,'O','Oxígeno',16,2],[16,'S','Azufre',16,3],[34,'Se','Selenio',16,4],[52,'Te','Telurio',16,5],[84,'Po','Polonio',16,6],
[9,'F','Flúor',17,2],[17,'Cl','Cloro',17,3],[35,'Br','Bromo',17,4],[53,'I','Yodo',17,5],[85,'At','Astato',17,6],
[2,'He','Helio',18,1],[10,'Ne','Neón',18,2],[18,'Ar','Argón',18,3],[36,'Kr','Criptón',18,4],[54,'Xe','Xenón',18,5],[86,'Rn','Radón',18,6]]
.map(a=>({z:a[0],s:a[1],n:a[2],g:a[3],p:a[4]}));

const G=[1,2,13,14,15,16,17,18],MODES=['Nombre','Símbolo','Posición'],SALT='tp-3eso',CL=['3A','3B','3C'];
const $a=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const normC=s=>s.toUpperCase().replace(/[\s.\-º°ª]/g,'');const hash=str=>{let h=5381;for(const c of str)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
let L={cls:'',name:'',st:{},h:[],sent:0},view='home',Q=[],i=0,ok=0,fb=null,wrong=[],dbh=null,isT=false,SN=null,TC='3A',delId=null,msg='';
try{Object.assign(L,JSON.parse(localStorage.getItem('tp')||'{}'))}catch(e){}
const persist=()=>{try{localStorage.setItem('tp',JSON.stringify(L))}catch(e){}};
function tot(st){let a=0,f=0;for(const k in st){const r=st[k];for(let m=0;m<3;m++){a+=r[m*2];f+=r[m*2+1]}}return[a,f]}
const pctOf=st=>{const[a,f]=tot(st);return a+f?Math.round(100*a/(a+f)):0};
function rec(sym,m,good){const a=L.st[sym]||(L.st[sym]=[0,0,0,0,0,0]);a[m*2+(good?0:1)]++;persist()}

const PWH='irccrq';
const ld=()=>{try{return JSON.parse(localStorage.getItem('tp_snaps')||'{}')}catch(e){return{}}};
const sv=o=>{try{localStorage.setItem('tp_snaps',JSON.stringify(o))}catch(e){msg='No se pudo guardar en este navegador'}};
function init(){try{isT=sessionStorage.getItem('tpT')==='1'}catch(e){}render()}
function cap(){const n=document.getElementById('nm'),c=document.getElementById('cl');if(n)L.name=n.value.trim();if(c)L.cls=normC(c.value);persist()}

function start(m){cap();
 if(!L.name||!L.cls){const n=document.getElementById(L.name?'cl':'nm');if(n){n.placeholder='Escribe aquí tu '+(L.name?'clase':'nombre');n.focus()}return}
 Q=[...E].sort(()=>Math.random()-.5).slice(0,10).map(e=>({e,m:m==3?Math.floor(Math.random()*3):m}));
 i=0;ok=0;fb=null;wrong=[];view='quiz';render()}
function answer(good,pick,v){const q=Q[i];fb={good,pick,v};if(good)ok++;else wrong.push(q);rec(q.e.s,q.m,good);render()}
function check(){const q=Q[i],v=document.getElementById('ans').value;if(!v.trim())return;
 answer(q.m==0?norm(v)===norm(q.e.n):v.trim()===q.e.s,0,v)}
function next(){fb=null;i++;if(i>=Q.length){L.h.push([Date.now(),ok,Q.length]);L.h=L.h.slice(-30);persist();view='end'}render()}

function mkCode(){const cl=x=>String(x).replace(/[|;:]/g,' ');
 const body=['v1',cl(L.cls),cl(L.name),Date.now(),Object.keys(L.st).map(k=>k+':'+L.st[k].join(',')).join(';'),L.h.slice(-12).map(r=>r[1]+'/'+r[2]).join(',')].join('|');
 return btoa(unescape(encodeURIComponent(body+'|'+hash(body+SALT))))}
function parse(code){try{const p=decodeURIComponent(escape(atob(code.replace(/\s/g,'')))).split('|'),chk=p.pop(),body=p.join('|');
 if(hash(body+SALT)!==chk)return null;const st={};(p[4]||'').split(';').filter(Boolean).forEach(x=>{const q=x.split(':');st[q[0]]=q[1].split(',').map(Number)});
 return{c:normC(p[1]),n:p[2],t:+p[3],st,h:p[5]||'',id:hash(code.replace(/\s/g,''))+'_'+p[3]}}catch(e){return null}}

function homeV(){const[a,f]=tot(L.st),h=L.h.slice(-5).map(r=>r[1]+'/'+r[2]).join(' · ');
 return `<h1>⚗️ Tabla periódica</h1><div class="card"><div class="mu">Tu nombre y apellidos</div><input id="nm" value="${esc(L.name)}" autocomplete="name">
 <input id="cl" value="${esc(L.cls)}" placeholder="Tu clase (ej. 3A)" maxlength="10" style="margin-top:8px">
 <div class="mu" style="margin-top:10px">Acumulado: <b class="ok">${a}</b> aciertos · <b class="ko">${f}</b> fallos ${a+f?'· <b>'+pctOf(L.st)+'%</b>':''}</div>
 ${h?`<div class="mu">Últimas rondas: ${h}</div>`:''}${msg?`<div class="ok">${esc(msg)}</div>`:''}</div>
 <div class="card"><b>Practica</b> <span class="mu">(10 preguntas)</span>
 <button data-a="s0">Ves el símbolo → escribe el nombre</button><button data-a="s1">Ves el nombre → escribe el símbolo</button>
 <button data-a="s2">Colócalo en la tabla</button><button data-a="s3" class="sec">Mezcla de todo</button></div>
 <div class="card"><b>Enviar al profesor</b><div class="mu">Tus aciertos y fallos se acumulan siempre. Cuando quieras mostrar tu progreso, genera un código y pégalo en Classroom.</div>
 <button data-a="g">Generar mi código</button><button data-a="r" class="sec">Recuperar mi progreso con un código</button></div>
 ${isT?'<button class="sec" data-a="t">👩‍🏫 Panel del profesor</button>':'<button class="sec" data-a="li" style="border:0;font-size:13px;opacity:.7">Acceso profesor</button>'}`}

const ALL=['H '+'- '.repeat(16)+'He','Li Be '+'- '.repeat(10)+'B C N O F Ne','Na Mg '+'- '.repeat(10)+'Al Si P S Cl Ar','K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr','Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe','Cs Ba * Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn','Fr Ra ** Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og'].map(r=>r.trim().split(' '));
const FB=['La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu'.split(' '),'Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr'.split(' ')];
function gridV(q){let h='<div style="overflow-x:auto"><div class="gr"><span></span>'+Array.from({length:18},(_,k)=>`<b>${k+1}</b>`).join('');
 ALL.forEach((row,r)=>{const p=r+1;h+=`<b>${p}</b>`;row.forEach((t,k)=>{const g=k+1;
  if(t=='-'){h+='<span></span>';return}
  const e=E.find(x=>x.g==g&&x.p==p);
  if(!e){h+=`<div class="c o${t[0]=='*'?' r':''}">${t=='*'?'57-71':t=='**'?'89-103':t}</div>`;return}
  let c='c t',s='';if(fb){if(e===q.e){c+=' good';s=e.s}else if(fb.pick===e.s+'x')c+=' bad'}
  h+=`<button class="${c}" data-g="${g}" data-p="${p}" ${fb?'disabled':''}>${s}</button>`})});
 h+='<span style="grid-column:1/-1;height:6px"></span>';
 FB.forEach((a,j)=>{h+=`<b>${'*'.repeat(j+1)}</b><span></span><span></span>`+a.map(t=>`<div class="c o">${t}</div>`).join('')+'<span></span>'});
 return h+'</div></div><div class="mu" style="margin-top:6px">Columnas = grupo · Filas = periodo · Los recuadros azules son los que se preguntan. Desliza hacia los lados para ver toda la tabla.</div>'}

function quizV(){const q=Q[i],e=q.e;
 let h=`<div class="mu">Pregunta ${i+1} de ${Q.length} · ${MODES[q.m]}</div><div class="bar"><i style="width:${100*i/Q.length}%"></i></div><div class="card">`;
 if(q.m==0)h+=`<div class="mu">¿Cómo se llama?</div><div class="big">${e.s}</div>`;
 else if(q.m==1)h+=`<div class="mu">Escribe su símbolo</div><div class="mid">${e.n}</div>`;
 else h+=`<div class="mu">Toca su casilla en la tabla</div><div class="mid">${e.n} <span class="mu">(${e.s})</span></div>`;
 if(q.m<2)h+=`<input id="ans" autocomplete="off" autocapitalize="${q.m?'on':'off'}" autocorrect="off" spellcheck="false" ${fb?'disabled':''} value="${fb&&fb.v?esc(fb.v):''}">`+(fb?'':'<button data-a="c">Comprobar</button>');
 else h+=gridV(q);
 if(fb)h+=`<div class="mid ${fb.good?'ok':'ko'}" style="margin-top:12px">${fb.good?'¡Correcto!':'Incorrecto'}</div>`+
  (fb.good?'':`<div style="text-align:center">${q.m==0?e.n:q.m==1?e.s:`Grupo ${e.g}, periodo ${e.p}`}</div>`)+'<button data-a="n">Siguiente</button>';
 return h+'</div>'}

function endV(){const p=pctOf(L.st),up=p>L.sent;
 return `<h1>Resultado: ${ok}/${Q.length}</h1><div class="card">${wrong.length?'<b>A repasar</b>'+wrong.map(q=>`<div class="row"><span>${q.e.s} · ${q.e.n}</span><span class="mu">G${q.e.g} · P${q.e.p}</span></div>`).join(''):'<b class="ok">¡Sin fallos! 🎉</b>'}
 <div class="mu" style="margin-top:8px">Acumulado: ${p}% de aciertos${up&&L.sent?' · <b class="ok">¡Has mejorado desde tu último envío!</b>':''}</div></div>
 <button data-a="s${Q.every(q=>q.m==Q[0].m)?Q[0].m:3}">Otra ronda</button>${up?'<button class="sec" data-a="g">Generar código para enviar</button>':''}<button class="sec" data-a="h">Inicio</button>`}

function codeV(){const c=mkCode();L.sent=pctOf(L.st);persist();
 return `<h1>Tu código</h1><div class="card"><div class="mu">Cópialo y pégalo en la tarea de Classroom. Puedes generar otro cuando mejores: nada se pierde ni se reinicia.</div>
 <textarea id="cd" readonly>${c}</textarea><button data-a="cp">Copiar código</button><div id="cm" class="ok"></div></div><button class="sec" data-a="h">← Volver</button>`}
function restoreV(){return `<h1>Recuperar progreso</h1><div class="card"><div class="mu">Pega aquí el último código que generaste (útil si cambias de móvil o se borraron los datos).</div>
 <textarea id="rc"></textarea><button data-a="rr">Recuperar</button><div class="ko">${esc(msg)}</div></div><button class="sec" data-a="h">← Volver</button>`}

function evo(ss){return ss.map((x,k)=>{if(!k)return pctOf(x.st);const t1=tot(ss[k-1].st),t2=tot(x.st),A=t2[0]-t1[0],F=t2[1]-t1[1];return A<0||F<0?pctOf(x.st):A+F?Math.round(100*A/(A+F)):'–'}).slice(-6).map(v=>v=='–'?v:v+'%').join(' → ')}
function teacherV(){
 let h='<h1>👩‍🏫 Panel</h1><button class="sec" data-a="h" style="margin:0 0 12px">← Volver</button>';
 h+=`<div class="card"><b>Añadir códigos de alumnos</b><div class="mu">Pega uno o varios códigos (uno por línea) o una copia de seguridad.</div><textarea id="im"></textarea><button data-a="imp">Importar</button><button data-a="bk" class="sec">Copia de seguridad (se muestra arriba, cópiala y guárdala)</button><div class="mu">${esc(msg)}</div></div>`;
 const CLS=[...new Set((SN||[]).map(x=>x.c))].sort();if(CLS.length&&!CLS.includes(TC))TC=CLS[0];
 h+='<div class="tabs" style="flex-wrap:wrap">'+CLS.map(c=>`<button data-a="k${esc(c)}" class="${c==TC?'':'sec'}" style="width:auto;flex:1 0 auto;padding:10px">${esc(c)}</button>`).join('')+'</div>';
 if(!SN)return h+'<div class="mu">Cargando…</div>';
 const by={};SN.filter(x=>x.c===TC).forEach(x=>(by[x.key]=by[x.key]||[]).push(x));
 const keys=Object.keys(by).sort((a,b)=>by[a][0].n.localeCompare(by[b][0].n));
 if(!keys.length)return h+'<div class="card mu">Sin resultados en '+TC+' todavía.</div>';
 const last=k=>by[k].reduce((a,b)=>b.t>a.t?b:a),avg=Math.round(keys.reduce((s,k)=>s+pctOf(last(k).st),0)/keys.length);
 h+=`<div class="mu" style="margin-bottom:8px">${keys.length} alumnos · media de la clase: <b>${avg}%</b></div>`;
 keys.forEach(k=>{const ss=by[k].sort((a,b)=>a.t-b.t),l=ss[ss.length-1],st=l.st,[a,f]=tot(st);
  const pm=[0,1,2].map(m=>{let x=0,y=0;for(const q in st){x+=st[q][m*2];y+=st[q][m*2+1]}return x+y?Math.round(100*x/(x+y))+'%':'–'});
  const w=Object.keys(st).map(q=>[q,st[q][1]+st[q][3]+st[q][5]]).filter(x=>x[1]>0).sort((x,y)=>y[1]-x[1]).slice(0,5).map(x=>`${x[0]} (${x[1]})`).join(', ')||'–';
  h+=`<div class="card"><b>${esc(l.n)}</b><div class="mu">${ss.length} envíos · último: ${new Date(l.t).toLocaleDateString('es-ES')}</div>
  <div class="row"><span>Evolución por envío</span><span>${evo(ss)}</span></div>${l.h?`<div class="row"><span>Últimas rondas</span><span>${esc(l.h.split(',').join(' → '))}</span></div>`:''}
  <div class="row"><span>Aciertos / fallos</span><span><b class="ok">${a}</b> / <b class="ko">${f}</b> · ${a+f} intentos · total ${a+f?Math.round(100*a/(a+f)):0}%</span></div>
  <div class="row"><span>Nombres · Símbolos · Posición</span><span>${pm.join(' · ')}</span></div>
  <div class="row"><span>Más falladas</span><span>${w}</span></div>
  <button class="sec" data-a="d" data-id="${esc(k)}" style="color:var(--ko);border-color:var(--ko)">${delId===k?'¿Seguro? Toca otra vez para borrar':'Eliminar alumno'}</button></div>`});
 return h}
function loadSN(){SN=Object.entries(ld()).map(e=>Object.assign({_id:e[0],key:e[1].c+'|'+norm(e[1].n)},e[1]))}
function startT(){view='teacher';loadSN();render()}
function imp(){const raw=document.getElementById('im').value.trim(),o=ld();let g=0,b=0;
 if(raw[0]=='{'){try{const j=JSON.parse(raw);for(const k in j){o[k]=j[k];g++}}catch(e){b++}}
 else raw.split(/\s+/).filter(Boolean).forEach(c=>{const p=parse(c);if(!p){b++;return}o[p.id]={c:p.c,n:p.n,t:p.t,st:p.st,h:p.h};g++});
 sv(o);loadSN();msg=g+' importados'+(b?' · '+b+' no válidos':'');render()}

function loginV(){return '<h1>Acceso profesor</h1><div class="card"><input id="pw" type="password" placeholder="Clave"><button data-a="lg">Entrar</button><div class="ko">'+esc(msg)+'</div></div><button class="sec" data-a="h">← Volver</button>'}
function render(){$a.innerHTML={home:homeV,quiz:quizV,end:endV,code:codeV,restore:restoreV,teacher:teacherV,login:loginV}[view]();
 const a=document.getElementById('ans');if(a&&!fb)a.focus()}
$a.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(b.dataset.g){const q=Q[i],g=+b.dataset.g,p=+b.dataset.p,e=E.find(x=>x.g==g&&x.p==p);answer(e===q.e,e.s+'x');return}
 if(!a)return;
 if(a[0]=='s')start(+a[1]);else if(a=='c')check();else if(a=='n')next();
 else if(a=='h'){cap();msg='';view='home';render()}
 else if(a=='g'){cap();if(!L.name||!L.cls){view='home';render();return}view='code';render()}
 else if(a=='cp'){const t=document.getElementById('cd');t.select();try{navigator.clipboard&&navigator.clipboard.writeText(t.value)}catch(e){}try{document.execCommand('copy')}catch(e){}document.getElementById('cm').textContent='Copiado ✓'}
 else if(a=='r'){cap();msg='';view='restore';render()}
 else if(a=='rr'){const p=parse(document.getElementById('rc').value);if(!p){msg='Código no válido';render();return}
  for(const k in p.st){const o=L.st[k]||[0,0,0,0,0,0];L.st[k]=p.st[k].map((v,j)=>Math.max(v,o[j]))}
  L.name=p.n;L.cls=p.c;L.sent=pctOf(L.st);persist();msg='Progreso recuperado ✓';view='home';render()}
 else if(a=='li'){cap();msg='';view='login';render()}else if(a=='lg'){if(hash(document.getElementById('pw').value+SALT)===PWH){isT=true;try{sessionStorage.setItem('tpT','1')}catch(e){}msg='';view='home'}else msg='Clave incorrecta';render()}else if(a=='bk'){document.getElementById('im').value=JSON.stringify(ld())}
 else if(a=='t')startT();else if(a=='imp')imp();
 else if(a[0]=='k'){TC=a.slice(1);render()}
 else if(a=='d'){const id=b.dataset.id;if(delId!==id){delId=id;render();return}delId=null;const o=ld();SN.filter(q=>q.key===id).forEach(q=>delete o[q._id]);sv(o);loadSN();render()}});
$a.addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.id=='ans')check();if(ev.key=='Enter'&&ev.target.id=='pw')document.querySelector('[data-a=lg]').click()});
render();init();
</script></body></html>
